# Still the workspace root, now with no member crates: the WASM layout engine,
# the font subsystem and the PDF writer left with the exporter that used them.
# Printing is the export path, and the browser owns that.
[workspace]
members = []

[package]
name = "loam"
version = "0.4.0"
description = "Loam desktop workspace"
authors = ["Jayden Wang"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.85"
default-run = "loam"

[[bin]]
name = "loam-cli"
path = "src/bin/loam_cli.rs"

[[bin]]
name = "loam-mcp"
path = "src/bin/loam_mcp.rs"

[lib]
name = "loam_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
log = "0.4"
notify = "6"
pdf-extract = "0.10.0"
reqwest = { version = "0.13.2", default-features = false, features = ["blocking", "json", "rustls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
# `preserve_order`, because this app merges into JSON files people maintain by
# hand — a settings file must come back with its keys where its owner left them,
# not alphabetised.
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
serde_yaml_ng = "0.10.0"
sha2 = "0.10"
tauri = { version = "2.10.3", features = ["devtools"] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tempfile = "3"
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }
trash = "5"
mempal-runtime = "0.9"
hf-hub = { version = "0.4", default-features = false, features = ["ureq"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication"] }
objc2-foundation = { version = "0.3", features = ["NSDictionary", "NSNotification", "NSOperation", "NSValue", "NSString", "block2"] }

[dev-dependencies]
async-trait = "0.1"
glob = "0.3"
png = "0.17"
